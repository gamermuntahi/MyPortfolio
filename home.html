<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dev. Muntahi</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #000;
  overflow: hidden;
  opacity: 0;
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn { to { opacity: 1; } }

/* NAVBAR */
.navbar {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1100px;
  height: 60px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;

  z-index: 100;

  /* NEW */
  animation: navIn 0.8s ease forwards;
}

@keyframes navIn {
  from { transform: translate(-50%, -30px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

.nav-left {
  color: white;
  font-weight: 600;
  animation: glow 3s infinite ease-in-out;
}

@keyframes glow {
  0%,100% { text-shadow: 0 0 5px #a855f7; }
  50% { text-shadow: 0 0 15px #3b82f6; }
}

.nav-links {
  display: flex;
  gap: 18px;
}

.nav-links a {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 14px;
  transition: 0.3s;
}

.nav-links a:hover {
  color: white;
  transform: translateY(-2px);
}

.volume {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
}

.volume input {
  width: 120px;
  accent-color: #a855f7;
}

/* HERO */
.heroArea {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.heroVideo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}

.heroOverlay {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.92));
  z-index: 2;
}

/* CARD */
.heroArea_text {
  position: relative;
  z-index: 3;
  width: 550px;
  max-width: 92%;
  padding: 35px;
  border-radius: 24px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.15);

  text-align: center;
  color: white;

  /* NEW */
  animation: cardIn 1s ease forwards;
}

@keyframes cardIn {
  from { transform: translateY(40px) scale(0.95); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

/* IMAGE */
.heroArea_text img {
  animation: floatImg 3s ease-in-out infinite;
}

@keyframes floatImg {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

/* TEXT */
.heroArea_text h1 {
  animation: textGlow 2.5s infinite ease-in-out;
}

@keyframes textGlow {
  0%,100% { text-shadow: 0 0 0px #a855f7; }
  50% { text-shadow: 0 0 18px #a855f7; }
}

/* META */
.meta {
  margin-top: 8px;
  font-size: 13px;
  opacity: 0.8;
  animation: fadeUp 1.2s ease forwards;
}

.status {
  margin-top: 10px;
  color: #22c55e;
  font-size: 14px;
  animation: fadeUp 1.4s ease forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ICONS */
.icons {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

.icons i {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  cursor: pointer;

  transition: 0.3s;

  /* NEW */
  animation: iconPop 1s ease forwards;
  opacity: 0;
}

.icons i:nth-child(1){ animation-delay: 0.2s; }
.icons i:nth-child(2){ animation-delay: 0.3s; }
.icons i:nth-child(3){ animation-delay: 0.4s; }
.icons i:nth-child(4){ animation-delay: 0.5s; }
.icons i:nth-child(5){ animation-delay: 0.6s; }

@keyframes iconPop {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.icons i:hover {
  transform: translateY(-3px) scale(1.1);
  background: rgba(168,85,247,0.25);
}

/* START SCREEN */
.startScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  color: white;
  font-size: 18px;
  cursor: pointer;

  animation: startFade 1s ease forwards;
}
/* SOUND METER */
.sound-meter {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 120px;
  z-index: 20;
}

.sound-meter.left { left: 18px; }
.sound-meter.right { right: 18px; }

.bar {
  width: 3px;
  height: 10px;
  background: linear-gradient(to top, #3b82f6, #a855f7, #ec4899);
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(168,85,247,0.5);
  transition: height 0.05s linear;
}

@keyframes startFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* METER */
.wave {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 20px;
  background: linear-gradient(to top,#3b82f6,#a855f7,#ec4899);
  box-shadow: 0 0 12px rgba(168,85,247,0.6);

  animation: waveIdle 1.5s infinite ease-in-out;
}

@keyframes waveIdle {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.5); }
}
</style>
</head>

<body>

<div class="startScreen" id="startScreen">
  Click anywhere to enter 🔊
</div>

<!-- NAV -->
<div class="navbar">
  <div class="nav-left">Dev. Muntahi</div>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Projects</a>
    <a href="#">Skills</a>
    <a href="#">Contact</a>
  </div>

  <div class="volume">
    <i class="fa-solid fa-volume-high"></i>
    <input type="range" min="0" max="1" step="0.01" id="vol">
  </div>
</div>

<!-- HERO -->
<section class="heroArea">
  <!-- SOUND METERS (EQUALIZER) -->
<div class="sound-meter left" id="meterLeft"></div>
<div class="sound-meter right" id="meterRight"></div>

  <video class="heroVideo" id="bgVideo" autoplay muted loop playsinline>
    <source src="static/video/Background01.mp4">
  </video>

  <div class="heroOverlay"></div>

  <div class="heroArea_text">
    <img src="static/image/font_mc_skin.png" width="110"
      style="border-radius:50%; border:3px solid rgba(255,255,255,0.15)"/>

    <h1>Dev. Muntahi</h1>
    <p>I don't just write code—I build AI, create games, design graphics, and transform ideas into reality.</p>

    <div class="meta">📍 Dhaka, Bangladesh</div>
    <div class="status">● Available for Projects</div>

    <div class="icons">
      <i class="fa-brands fa-discord"></i>
      <i class="fa-brands fa-github"></i>
      <i class="fa-brands fa-youtube"></i>
      <i class="fa-brands fa-steam"></i>
      <i class="fa-solid fa-envelope"></i>
    </div>
  </div>

</section>

<!-- METERS -->
<div class="meter left"><div class="line"><div class="wave" id="waveL"></div></div></div>
<div class="meter right"><div class="line"><div class="wave" id="waveR"></div></div></div>

<audio id="bgAudio" loop>
  <source src="static/audio/Background01.mp3">
</audio>

<script>
const audio = document.getElementById("bgAudio");
const video = document.getElementById("bgVideo");
const vol = document.getElementById("vol");
const startScreen = document.getElementById("startScreen");

vol.addEventListener("input", e => {
  audio.volume = e.target.value;
});

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = ctx.createAnalyser();
analyser.fftSize = 64;

const source = ctx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctx.destination);

const data = new Uint8Array(analyser.frequencyBinCount);

const waveL = document.getElementById("waveL");
const waveR = document.getElementById("waveR");

startScreen.addEventListener("click", async () => {
  startScreen.style.display = "none";
  await ctx.resume();
  audio.play();
  video.play();
});

function animate() {
  requestAnimationFrame(animate);

  analyser.getByteFrequencyData(data);

  for (let i = 0; i < bars; i++) {
    let index = Math.floor((i / bars) * data.length);
    let value = data[index];

    let height = Math.max(5, value * 0.6);

    leftBars[i].style.height = height + "px";
    rightBars[i].style.height = height + "px";
  }
}



/* CREATE BARS */
const bars = 12;

for (let i = 0; i < bars; i++) {
  let b1 = document.createElement("div");
  let b2 = document.createElement("div");

  b1.classList.add("bar");
  b2.classList.add("bar");

  meterLeft.appendChild(b1);
  meterRight.appendChild(b2);
}

const leftBars = meterLeft.querySelectorAll(".bar");
const rightBars = meterRight.querySelectorAll(".bar");


animate();
</script>

</body>
</html>
