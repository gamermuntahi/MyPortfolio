<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/image/Favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="static/style.css">
    <title>Muntahi</title>
</head>

<body>
    <div id="mainDiv">
        <nav class="enter_screen">
            <div class="camera-container">
                <div class="bg-layer bg-layer-1"></div>
                <div class="bg-layer bg-layer-2"></div>
                <div class="flash-overlay"></div>
                <div class="vignette-overlay"></div>
                <div class="center_stage">

                    <div class="stage_line_container">
                        <div class="enterscreen_text_pos"></div>
                        <div class="stage_line"></div>
                        <div class="line-sweep-edge"></div>
                    </div>
                    <div class="enter_screen_imgs">
                        <div class="char-container char-left">
                            <img class="sword-left" src="static/image/Iron_sword_mc.png" alt="Sword">
                        </div>
                        <div class="char-container char-center">
                            <img class="character-center" src="static/image/font_mc_skin.png" alt="Character">
                        </div>
                        <div class="char-container char-right">
                            <img class="sword-right" src="static/image/Iron_sword_mc.png" alt="Sword">
                        </div>

                    </div>
                    <div class="enter-text-container">
                        <span class="enter-letter" data-i="0">C</span>
                        <span class="enter-letter" data-i="1">L</span>
                        <span class="enter-letter" data-i="2">I</span>
                        <span class="enter-letter" data-i="3">C</span>
                        <span class="enter-letter" data-i="4">K</span>
                        <span class="enter-letter-space"></span>
                        <span class="enter-letter" data-i="6">T</span>
                        <span class="enter-letter" data-i="7">O</span>
                        <span class="enter-letter-space"></span>
                        <span class="enter-letter" data-i="9">E</span>
                        <span class="enter-letter" data-i="10">N</span>
                        <span class="enter-letter" data-i="11">T</span>
                        <span class="enter-letter" data-i="12">E</span>
                        <span class="enter-letter" data-i="13">R</span>
                        <span class="enter-letter" data-i="14">!</span>
                    </div>
                    <h1 id="enter-screen-title_"></h1>
                    <h1 class="enter-screen-title" style="font-size: 30px;">Dev. Muntahi</h1>
                    <h2 class="enter-screen-title_1" style="font-size: 15px;">AI builder, game creator, engineer,
                        designer.</h2>
                </div>
            </div>
        </nav>
    </div>
    <script src="static/script.js"></script>
</body>

</html>
